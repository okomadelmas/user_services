server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

#=====================
#Logs Docker
#====================
scrape_configs:
  - job_name: all-conteneur-logs
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

#===============================
#Logs fichiers Spring Boot
#===============================
  - job_name: user-services-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: user_services
          source: file
          __path__: /app/logs/*.log

    pipeline_stages:
      - json:
          expressions:
            level: level
            message: message
            service: service
            env: env
      - labels:
          level:
          service:
          env:
